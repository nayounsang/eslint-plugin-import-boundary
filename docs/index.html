<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>eslint-plugin-import-boundary</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Import boundaries via public entries and directory nesting" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      .sidebar {
        padding-left: 16px;
        padding-right: 12px;
      }
      .sidebar > h1 {
        margin: 0 0 0.5rem;
        padding: 0.75rem 0 0;
      }
      .sidebar-nav {
        padding-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="//cdn.jsdelivr.net/npm/mermaid@9.3.0/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({ startOnLoad: false });
      let mermaidId = 0;
      window.$docsify = {
        name: "eslint-plugin-import-boundary",
        repo: "nayounsang/eslint-plugin-import-boundary",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        markdown: {
          renderer: {
            code(code, lang) {
              if (lang === "mermaid") {
                return (
                  '<div class="mermaid">' +
                  mermaid.render("mermaid-svg-" + mermaidId++, code) +
                  "</div>"
                );
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
